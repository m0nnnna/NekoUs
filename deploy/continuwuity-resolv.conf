# Mounted into the optional `matrix` (Continuwuity) service in docker-compose.yml at
# /etc/resolv.conf. Docker's default embedded DNS resolver is documented upstream to cause
# federation lookup timeouts for Continuwuity — a real public resolver avoids that. Only read by
# that one container; has no effect on anything else in this stack.
nameserver 1.1.1.1
nameserver 8.8.8.8
